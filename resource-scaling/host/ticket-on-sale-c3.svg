<svg xmlns="http://www.w3.org/2000/svg" width="4000" height="2250" viewBox="0 0 4000 2250" role="img" aria-labelledby="title description">
  <title id="title">Web/API component view for Big Bands Ticket Gatekeeper before Quest 1</title>
  <desc id="description">C4-style component view of Web/API in the fictional Big Bands Ticket Gatekeeper platform. The user reaches the router, catalog, reservation, and checkout from left to right. Checkout passes a completed purchase to one internal Email service component below it, which calls the external Email provider. The system owns a primary database; payment and email providers are external software systems. There is no event-details cache or waiting room.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, Arial, sans-serif; fill: #26015c; }
      .eyebrow { font-size: 45px; font-weight: 750; fill: #ff4200; letter-spacing: .08em; }
      .title { font-size: 83px; font-weight: 750; }
      .subtitle { font-size: 43px; fill: #59417b; }
      .system-boundary { fill: #fffaf2; stroke: #ff4200; stroke-width: 6; }
      .container-boundary { fill: #fff; stroke: #5000c4; stroke-width: 6; }
      .boundary-kind { font-size: 35px; font-weight: 750; fill: #59417b; letter-spacing: .06em; }
      .boundary-title { font-size: 58px; font-weight: 750; }
      .boundary-note { font-size: 38px; fill: #59417b; }
      .component, .owned { fill: #fff; stroke: #5000c4; stroke-width: 5; }
      .new { fill: #fff1df; stroke: #ff4200; stroke-width: 6; }
      .external { fill: #fff; stroke: #78638d; stroke-width: 5; }
      .person { fill: #fff; stroke: #5000c4; stroke-width: 5; }
      .node-kind { font-size: 27px; font-weight: 750; fill: #59417b; letter-spacing: .05em; }
      .node-title { font-size: 43px; font-weight: 750; }
      .node-detail { font-size: 32px; fill: #59417b; }
      .router-title { font-size: 41px; }
      .seat-title { font-size: 41px; }
      .gate-title { font-size: 39px; }
      .gate-detail { font-size: 31px; }
      .worker-title { font-size: 35px; }
      .queue-title { font-size: 37px; }
      .external-title { font-size: 35px; }
      .line { fill: none; stroke: #5000c4; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .new-line { fill: none; stroke: #ff4200; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#new-arrow); }
      .branch { fill: none; stroke: #5000c4; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label { font-size: 32px; font-weight: 650; fill: #59417b; }
      .legend { font-size: 30px; fill: #59417b; }
      .footer { font-size: 30px; font-weight: 700; fill: #59417b; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L11 5 L0 10 Z" fill="#5000c4" /></marker>
    <marker id="new-arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L11 5 L0 10 Z" fill="#ff4200" /></marker>
  </defs>

  <rect width="4000" height="2250" fill="#f1ede3" />
  <text x="75" y="75" class="eyebrow">C3 · COMPONENT VIEW · WEB/API · STARTING DESIGN</text>
  <text x="75" y="170" class="title">BBTG · starting architecture</text>
  <text x="75" y="238" class="subtitle">One internal email component calls the external provider</text>

  <rect x="450" y="300" width="2900" height="1690" rx="55" class="system-boundary" />
  <text x="520" y="365" class="boundary-kind">SOFTWARE SYSTEM</text>
  <text x="520" y="433" class="boundary-title">Big Bands Ticket Gatekeeper</text>

  <rect x="610" y="480" width="1600" height="1450" rx="48" class="container-boundary" />
  <text x="675" y="540" class="boundary-kind">CONTAINER · APPLICATION</text>
  <text x="675" y="610" class="boundary-title">Web/API</text>
  <text x="675" y="660" class="boundary-note">Components inside the focus container</text>

  <path d="M400 1110 H730" class="line" />
  <path d="M1130 1110 H1190 M1190 790 V1110" class="branch" />
  <path d="M1190 790 H1600" class="line" />
  <path d="M1190 1110 H1680" class="line" />
  <path d="M1895 1200 V1400" class="line" />
  <path d="M2100 790 H2250 V1055 H2390" class="line" />
  <path d="M2110 1110 H2260 V1165 H2390 M2110 1490 H3550" class="line" />
  <path d="M1895 1580 V1690 M2110 1780 H3550" class="line" />

  <rect x="70" y="1020" width="330" height="180" rx="27" class="person" />
  <text x="106" y="1070" class="node-kind">PERSON</text>
  <text x="106" y="1132" class="node-title">User</text>
  <text x="106" y="1178" class="node-detail">Browses and buys</text>
  <rect x="730" y="1020" width="400" height="180" rx="27" class="component" />
  <text x="766" y="1070" class="node-kind">COMPONENT</text>
  <text x="766" y="1132" class="node-title router-title">Request router</text>
  <text x="766" y="1178" class="node-detail">Routes HTTP calls</text>
  <rect x="1600" y="700" width="500" height="180" rx="27" class="component" />
  <text x="1636" y="750" class="node-kind">COMPONENT</text>
  <text x="1636" y="812" class="node-title">Event catalog</text>
  <text x="1636" y="858" class="node-detail">Event + availability</text>

  <rect x="1680" y="1020" width="430" height="180" rx="27" class="component" />
  <text x="1716" y="1070" class="node-kind">COMPONENT</text>
  <text x="1716" y="1132" class="node-title seat-title">Seat reservation</text>
  <text x="1716" y="1178" class="node-detail">Requests atomic hold</text>
  <rect x="1680" y="1400" width="430" height="180" rx="27" class="component" />
  <text x="1716" y="1450" class="node-kind">COMPONENT</text>
  <text x="1716" y="1512" class="node-title">Checkout</text>
  <text x="1716" y="1558" class="node-detail">Purchase + payment</text>

  <rect x="2390" y="1020" width="600" height="210" rx="27" class="owned" />
  <text x="2426" y="1070" class="node-kind">CONTAINER · DATA STORE</text>
  <text x="2426" y="1132" class="node-title">Primary database</text>
  <text x="2426" y="1178" class="node-detail">Availability + seat holds</text>
  <rect x="1680" y="1690" width="430" height="180" rx="27" class="component" />
  <text x="1716" y="1740" class="node-kind">COMPONENT</text>
  <text x="1716" y="1802" class="node-title">Email service</text>
  <text x="1716" y="1848" class="node-detail">Renders PDF + sends</text>
  <rect x="3550" y="1400" width="380" height="180" rx="27" class="external" />
  <text x="3586" y="1450" class="node-kind">SOFTWARE SYSTEM</text>
  <text x="3586" y="1512" class="node-title external-title">Payment provider</text>
  <text x="3586" y="1558" class="node-detail">Authorizes payments</text>
  <rect x="3550" y="1690" width="380" height="180" rx="27" class="external" />
  <text x="3586" y="1740" class="node-kind">SOFTWARE SYSTEM</text>
  <text x="3586" y="1802" class="node-title external-title">Email provider</text>
  <text x="3586" y="1848" class="node-detail">Delivers messages</text>

  <text x="520" y="1065" class="edge-label">HTTPS</text>
  <text x="1270" y="764" class="edge-label">routes browse</text>
  <text x="1300" y="1082" class="edge-label">routes reservation</text>
  <text x="2240" y="745" class="edge-label">reads event data</text>
  <text x="2170" y="1250" class="edge-label">writes hold</text>
  <text x="1930" y="1325" class="edge-label">on success</text>
  <text x="2730" y="1465" class="edge-label">requests payment</text>
  <text x="1600" y="1650" class="edge-label">after purchase</text>
  <text x="2650" y="1745" class="edge-label">calls provider</text>

  <path d="M75 2070 H3930" stroke="#d6c6dc" stroke-width="3" />
  <rect x="75" y="2115" width="42" height="33" rx="7" class="component" />
  <text x="135" y="2142" class="legend">Web/API component</text>
  <rect x="525" y="2115" width="42" height="33" rx="7" class="owned" />
  <text x="585" y="2142" class="legend">owned container</text>
  <rect x="900" y="2115" width="42" height="33" rx="7" class="external" />
  <text x="960" y="2142" class="legend">external software system</text>

  <text x="3930" y="2142" class="footer" text-anchor="end">No catalog cache · no waiting room</text>
  <text x="75" y="2215" class="legend">Fictional workshop architecture · component view focused on Web/API</text>
</svg>
