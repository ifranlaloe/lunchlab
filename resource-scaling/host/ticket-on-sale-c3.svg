<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Fictional ticket on-sale system: C4 Level 3 component diagram</title>
  <desc id="description">Starting synchronous request path for the host-led ticket-sale quests. A fan sends HTTPS requests to a Web/API container. Its request router calls catalog, seat reservation, and checkout components. Catalog and reservation access one primary database; checkout calls an external payment provider. No catalog cache, read replica, or waiting room is present. The existing asynchronous confirmation branch is outside this diagram's scope.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, Arial, sans-serif; fill: #0b1f4d; }
      .title { font-size: 43px; font-weight: 750; }
      .subtitle { font-size: 22px; fill: #405789; }
      .eyebrow { font-size: 18px; font-weight: 750; fill: #bc541a; letter-spacing: .1em; }
      .boundary { fill: #edf3fc; stroke: #164194; stroke-width: 4; }
      .boundary-title { font-size: 30px; font-weight: 750; }
      .boundary-note { font-size: 18px; fill: #405789; }
      .component { fill: #fff; stroke: #164194; stroke-width: 3; }
      .support { fill: #fff; stroke: #164194; stroke-width: 3; }
      .external { fill: #fff; stroke: #657592; stroke-width: 3; }
      .person { fill: #edf3fc; stroke: #164194; stroke-width: 3; }
      .node-kind { font-size: 18px; font-weight: 750; fill: #405789; letter-spacing: .07em; }
      .node-title { font-size: 24px; font-weight: 750; }
      .node-detail { font-size: 20px; fill: #405789; }
      .relation { fill: none; stroke: #164194; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #164194; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .edge-label { font-size: 19px; font-weight: 650; fill: #405789; }
      .legend { font-size: 18px; fill: #405789; }
      .footer { font-size: 18px; font-weight: 700; fill: #405789; }
    </style>
    <marker id="arrow" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 4.5 L0 9 Z" fill="#164194" />
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#f8fbff" />
  <text x="50" y="49" class="eyebrow">C4 · LEVEL 3 · STARTING DESIGN</text>
  <text x="50" y="99" class="title">Fictional ticket on-sale system</text>
  <text x="50" y="134" class="subtitle">Components inside the Web/API container · technology choices left open</text>

  <rect x="300" y="165" width="880" height="590" rx="29" class="boundary" />
  <text x="337" y="209" class="boundary-title">Web/API</text>
  <text x="337" y="239" class="boundary-note">One HTTP application</text>

  <path d="M250 465 H340" class="relation" />
  <path d="M545 465 H590 M590 282 V646" class="branch" />
  <path d="M590 282 H650 M590 462 H650 M590 646 H650" class="relation" />
  <path d="M950 282 H1100 V360 H1270" class="relation" />
  <path d="M950 462 H1220 V425 H1270" class="relation" />
  <path d="M800 590 V525" class="relation" />
  <path d="M950 646 H1270" class="relation" />

  <rect x="50" y="400" width="200" height="130" rx="20" class="person" />
  <text x="76" y="430" class="node-kind">PERSON</text>
  <text x="76" y="467" class="node-title">Fan</text>
  <text x="76" y="497" class="node-detail">Browses and buys</text>

  <rect x="340" y="400" width="205" height="130" rx="20" class="component" />
  <text x="365" y="430" class="node-kind">COMPONENT</text>
  <text x="365" y="467" class="node-title">Request router</text>
  <text x="365" y="496" class="node-detail">Routes HTTP calls</text>

  <rect x="650" y="225" width="300" height="115" rx="20" class="component" />
  <text x="675" y="255" class="node-kind">COMPONENT</text>
  <text x="675" y="291" class="node-title">Event catalog</text>
  <text x="675" y="319" class="node-detail">Event and availability reads</text>

  <rect x="650" y="405" width="300" height="115" rx="20" class="component" />
  <text x="675" y="435" class="node-kind">COMPONENT</text>
  <text x="675" y="471" class="node-title">Seat reservation</text>
  <text x="675" y="499" class="node-detail">Authoritative seat holds</text>

  <rect x="650" y="590" width="300" height="115" rx="20" class="component" />
  <text x="675" y="620" class="node-kind">COMPONENT</text>
  <text x="675" y="656" class="node-title">Checkout</text>
  <text x="675" y="684" class="node-detail">Purchase and payment flow</text>

  <rect x="1270" y="325" width="280" height="145" rx="20" class="support" />
  <text x="1295" y="357" class="node-kind">CONTAINER · DATA STORE</text>
  <text x="1295" y="398" class="node-title">Primary database</text>
  <text x="1295" y="429" class="node-detail">Event and seat data</text>

  <rect x="1270" y="580" width="280" height="130" rx="20" class="external" />
  <text x="1295" y="611" class="node-kind">EXTERNAL SYSTEM</text>
  <text x="1295" y="649" class="node-title">Payment provider</text>
  <text x="1295" y="679" class="node-detail">Authorizes payment</text>

  <text x="271" y="444" class="edge-label">HTTPS</text>
  <text x="550" y="444" class="edge-label">routes</text>
  <text x="991" y="262" class="edge-label">reads event data</text>
  <text x="1033" y="443" class="edge-label">writes seat hold</text>
  <text x="817" y="561" class="edge-label">validates hold</text>
  <text x="1049" y="628" class="edge-label">requests payment</text>

  <path d="M50 795 H1550" stroke="#c8d7ef" stroke-width="2" />
  <rect x="50" y="816" width="27" height="21" rx="5" class="component" />
  <text x="87" y="833" class="legend">component in Web/API</text>
  <rect x="345" y="816" width="27" height="21" rx="5" class="support" />
  <text x="382" y="833" class="legend">supporting container</text>
  <rect x="642" y="816" width="27" height="21" rx="5" class="external" />
  <text x="679" y="833" class="legend">external system</text>
  <text x="1550" y="834" class="footer" text-anchor="end">No catalog cache · no read replica · no waiting room</text>
  <text x="50" y="872" class="legend">Fictional workshop architecture — not Ticketmaster's production system</text>
</svg>
