<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="t d">
  <title id="t">Vertical scaling: one machine gets more resources</title><desc id="d">The same workload moves from a smaller node to a larger node with more CPU and memory, while remaining one failure domain.</desc>
  <style>text{font-family:Inter,Arial,sans-serif;fill:#0b1f4d}.label{font-size:28px;font-weight:700}.small{font-size:21px;fill:#405789}.metric{font-size:19px;font-weight:700}.node{fill:#fff;stroke:#164194;stroke-width:4}.bar{fill:#164194}.track{fill:#dce7f6}</style>
  <text x="193" y="50" class="label" text-anchor="middle">One node</text><text x="962" y="50" class="label" text-anchor="middle">Same workload, larger node</text>
  <rect x="70" y="105" width="270" height="260" rx="24" class="node"/><text x="205" y="163" class="label" text-anchor="middle">Processor</text>
  <text x="98" y="221" class="metric">CPU</text><rect x="98" y="238" width="214" height="20" rx="10" class="track"/><rect x="98" y="238" width="98" height="20" rx="10" class="bar"/>
  <text x="98" y="297" class="metric">Memory</text><rect x="98" y="314" width="214" height="20" rx="10" class="track"/><rect x="98" y="314" width="90" height="20" rx="10" class="bar"/>
  <path d="M405 235h226" fill="none" stroke="#164194" stroke-width="9" stroke-linecap="round"/><path d="m611 213 34 22-34 22" fill="none" stroke="#164194" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="720" y="75" width="420" height="320" rx="28" class="node"/><text x="930" y="137" class="label" text-anchor="middle">Processor</text>
  <text x="765" y="204" class="metric">CPU</text><rect x="765" y="225" width="330" height="22" rx="11" class="track"/><rect x="765" y="225" width="275" height="22" rx="11" class="bar"/>
  <text x="765" y="287" class="metric">Memory</text><rect x="765" y="308" width="330" height="22" rx="11" class="track"/><rect x="765" y="308" width="268" height="22" rx="11" class="bar"/>
  <text x="600" y="435" class="small" text-anchor="middle">More headroom on one machine • simple to operate • still one failure domain</text>
</svg>
