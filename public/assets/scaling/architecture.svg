<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
  <title id="t">Architecture change enables independent scaling</title><desc id="d">Four stages: a coupled order service becomes hot; copying it is blocked by local state and ownership; splitting it with a queue creates separate workloads; worker pools can then scale independently.</desc>
  <style>text{font-family:Inter,Arial,sans-serif;fill:#0b1f4d}.head{font-size:21px;font-weight:700}.body{font-size:18px;fill:#405789}.tiny{font-size:17px;font-weight:700}.panel{fill:#fff;stroke:#c8d7ef;stroke-width:3}.box{fill:#edf3fc;stroke:#164194;stroke-width:3}.hot{fill:#fff0e6;stroke:#db642b;stroke-width:4}.line{fill:none;stroke:#164194;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.stop{fill:none;stroke:#db642b;stroke-width:6;stroke-linecap:round}</style>
  <rect x="16" y="18" width="555" height="204" rx="20" class="panel"/><rect x="629" y="18" width="555" height="204" rx="20" class="panel"/>
  <rect x="16" y="256" width="555" height="204" rx="20" class="panel"/><rect x="629" y="256" width="555" height="204" rx="20" class="panel"/>
  <text x="40" y="53" class="head">1  ·  One coupled bottleneck</text><rect x="55" y="75" width="460" height="119" rx="17" class="hot"/>
  <text x="285" y="106" class="head" text-anchor="middle">Order service</text><text x="285" y="137" class="body" text-anchor="middle">API · payment · inventory · notifications</text><text x="285" y="170" class="tiny" text-anchor="middle">HOT: everything scales together</text>
  <text x="653" y="53" class="head">2  ·  More copies are blocked</text><rect x="670" y="85" width="191" height="88" rx="16" class="box"/><rect x="936" y="85" width="191" height="88" rx="16" class="box"/>
  <text x="765" y="119" class="tiny" text-anchor="middle">Order service A</text><text x="765" y="147" class="body" text-anchor="middle">owns state</text><text x="1032" y="119" class="tiny" text-anchor="middle">Order service B</text><text x="1032" y="147" class="body" text-anchor="middle">owns state?</text>
  <path d="M863 126h70" class="stop"/><path d="m886 108 24 36m0-36-24 36" class="stop"/><text x="899" y="204" class="body" text-anchor="middle">Ownership and coordination are unresolved</text>
  <text x="40" y="292" class="head">3  ·  Change the boundary</text><rect x="42" y="322" width="150" height="82" rx="16" class="box"/><rect x="252" y="322" width="150" height="82" rx="16" class="box"/>
  <text x="117" y="372" class="tiny" text-anchor="middle">Order API</text><text x="327" y="372" class="tiny" text-anchor="middle">Event / queue</text>
  <path d="M195 363h51m-17-14 20 14-20 14M406 363h57" class="line"/><text x="295" y="436" class="body" text-anchor="middle">Separate arrival from processing</text>
  <text x="653" y="292" class="head">4  ·  Scale workloads independently</text><rect x="652" y="329" width="161" height="80" rx="16" class="box"/><rect x="827" y="329" width="161" height="80" rx="16" class="box"/><rect x="1002" y="329" width="161" height="80" rx="16" class="box"/>
  <text x="732" y="361" class="tiny" text-anchor="middle">Payment</text><text x="732" y="387" class="body" text-anchor="middle">workers</text><text x="907" y="361" class="tiny" text-anchor="middle">Inventory</text><text x="907" y="387" class="body" text-anchor="middle">workers</text><text x="1082" y="361" class="tiny" text-anchor="middle">Notification</text><text x="1082" y="387" class="body" text-anchor="middle">workers</text>
  <path d="M576 120h44m-16-14 20 14-20 14M577 363h44m-16-14 20 14-20 14" class="line"/>
</svg>
