<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
  <title id="t">Different workloads have different scaling constraints</title><desc id="d">A two-column comparison highlights horizontally divisible work, coordination-heavy work, workloads helped by larger nodes, and limits that more CPU or memory will not fix.</desc>
  <style>text{font-family:Inter,Arial,sans-serif;fill:#0b1f4d}.head{font-size:27px;font-weight:700}.body{font-size:21px;fill:#405789}.box{fill:#fff;stroke:#c8d7ef;stroke-width:3}.accent{fill:#edf3fc;stroke:#164194}.warn{fill:#fff7eb;stroke:#d9852b}</style>
  <rect x="25" y="20" width="560" height="203" rx="23" class="box accent"/><rect x="615" y="20" width="560" height="203" rx="23" class="box warn"/>
  <rect x="25" y="246" width="560" height="203" rx="23" class="box accent"/><rect x="615" y="246" width="560" height="203" rx="23" class="box warn"/>
  <text x="55" y="66" class="head">Horizontal: easier when work divides</text><text x="55" y="112" class="body">Stateless API • independent consumers</text><text x="55" y="148" class="body">Read workers • parallel requests</text><text x="55" y="193" class="body">Question: who owns each slice?</text>
  <text x="645" y="66" class="head">Horizontal: harder with coordination</text><text x="645" y="112" class="body">Seat writes • local sessions • ordering</text><text x="645" y="148" class="body">One owner • strong consistency</text><text x="645" y="193" class="body">Question: can ownership be divided?</text>
  <text x="55" y="292" class="head">Vertical: useful for local limits</text><text x="55" y="338" class="body">CPU-heavy processing • memory pressure</text><text x="55" y="374" class="body">Database buffer pool • larger working set</text><text x="55" y="419" class="body">Question: will one node gain headroom?</text>
  <text x="645" y="292" class="head">Vertical: not a universal escape</text><text x="645" y="338" class="body">Shared dependency • global demand</text><text x="645" y="374" class="body">Unbounded fan-out • fixed external limit</text><text x="645" y="419" class="body">Question: where is the actual limit?</text>
</svg>
