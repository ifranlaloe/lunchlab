<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="t d">
  <title id="t">Fictional Ticketmaster browse and purchase flow</title><desc id="d">A waiting room limits admission. Browse requests use catalog and cache while purchase requests reach checkout and shared seat inventory, the contention point.</desc>
  <style>text{font-family:Inter,Arial,sans-serif;fill:#0b1f4d}.head{font-size:24px;font-weight:700}.label{font-size:19px;font-weight:700}.small{font-size:18px;fill:#405789}.box{fill:#fff;stroke:#164194;stroke-width:3}.accent{fill:#edf3fc;stroke:#164194;stroke-width:3}.hot{fill:#fff0e6;stroke:#db642b;stroke-width:5}.line{fill:none;stroke:#164194;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.risk{fill:#b54b1e;font-size:18px;font-weight:700}</style>
  <text x="30" y="46" class="head">One event, two very different workloads</text>
  <rect x="30" y="157" width="170" height="110" rx="20" class="box"/><text x="115" y="220" class="label" text-anchor="middle">Fans</text>
  <path d="M204 211h38m-17-13 20 13-20 13" class="line"/><rect x="250" y="157" width="190" height="110" rx="20" class="accent"/><text x="345" y="202" class="label" text-anchor="middle">Waiting room</text><text x="345" y="233" class="small" text-anchor="middle">control admission</text>
  <path d="M444 211h54m0-92v193m0-193h33m-33 193h33" class="line"/>
  <text x="568" y="81" class="small">BROWSE</text><rect x="535" y="100" width="182" height="77" rx="17" class="box"/><text x="626" y="146" class="label" text-anchor="middle">Catalog API</text>
  <path d="M721 139h72m-17-13 20 13-20 13" class="line"/><rect x="800" y="100" width="170" height="77" rx="17" class="accent"/><text x="885" y="146" class="label" text-anchor="middle">Cache</text>
  <text x="568" y="275" class="small">PURCHASE</text><rect x="535" y="295" width="182" height="77" rx="17" class="box"/><text x="626" y="341" class="label" text-anchor="middle">Checkout</text>
  <path d="M721 334h72m-17-13 20 13-20 13" class="line"/><rect x="800" y="281" width="355" height="107" rx="19" class="hot"/><text x="977" y="326" class="label" text-anchor="middle">Seat inventory</text><text x="977" y="357" class="risk" text-anchor="middle">one seat · one winner</text>
  <text x="600" y="444" class="small" text-anchor="middle">Fictional design exercise — not Ticketmaster's production architecture</text>
</svg>
