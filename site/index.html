<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8fbff" />
    <title>LunchLab slide decks</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; color: #0b1f4d; background: #f8fbff; }
      main { width: min(100% - 48px, 960px); margin: 0 auto; padding: clamp(56px, 10vh, 120px) 0 80px; }
      .eyebrow { margin: 0 0 18px; color: #164194; font-size: 14px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { max-width: 760px; margin: 0; font-size: clamp(42px, 6vw, 72px); line-height: 1.06; letter-spacing: -.035em; }
      .intro { margin: 22px 0 56px; color: #405789; font-size: clamp(19px, 2.5vw, 25px); line-height: 1.4; }
      nav ul { display: grid; gap: 18px; margin: 0; padding: 0; list-style: none; }
      nav a { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 24px; align-items: center; padding: 28px 32px; border: 2px solid #c8d7ef; border-radius: 18px; background: #fff; color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
      nav a:hover { border-color: #164194; transform: translateY(-2px); }
      nav a:focus-visible { outline: 4px solid #164194; outline-offset: 4px; }
      .deck-title { font-size: clamp(24px, 3vw, 34px); font-weight: 750; line-height: 1.15; }
      .deck-description { grid-column: 1; color: #405789; font-size: 18px; line-height: 1.4; }
      .arrow { grid-column: 2; grid-row: 1 / 3; color: #164194; font-size: 36px; line-height: 1; }
      @media (max-width: 540px) { main { width: min(100% - 32px, 960px); } nav a { padding: 24px; } .deck-description { font-size: 16px; } }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">LunchLab</p>
      <h1>Choose a slide deck</h1>
      <p class="intro">Architecture conversations, one topic at a time.</p>
      <nav aria-label="LunchLab slide decks">
        <ul>
          <li>
            <a href="./zooming-with-c4/">
              <span class="deck-title">Zooming with C4</span>
              <span class="deck-description">Agree on the zoom level: context first, details later.</span>
              <span class="arrow" aria-hidden="true">↗</span>
            </a>
          </li>
          <li>
            <a href="./resource-scaling/">
              <span class="deck-title">Resource Scaling</span>
              <span class="deck-description">Find the pressure, understand the state, then choose how to scale.</span>
              <span class="arrow" aria-hidden="true">↗</span>
            </a>
          </li>
        </ul>
      </nav>
    </main>
  </body>
</html>
